<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TiLTNin Tow Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-sA+e2v+o3s0u6q0a6Z6iQf2KxkPp9GqCqg1h6vGQXnY=" crossorigin=""/>
</head>
<body>
  <div class="container">
    <header>
      <h1>Tow Driver Tracker</h1>
    </header>

    <section class="left">
      <div class="qr-block">
        <h2>Call Tow</h2>
        <div id="qrcode"></div>
        <p><a id="phone-link" href="tel:+16025795145">Call +1 (602) 579-5145</a></p>
      </div>

      <div class="eta-block">
        <h3>Estimated Time of Arrival</h3>
        <div id="eta">Loading...</div>
        <div id="updated">Last update: --</div>
      </div>
    </section>

    <section class="right">
      <div id="map" style="height:500px;"></div>
    </section>
  </div>

  <!-- QRCode.js (small lib) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
    integrity="sha256-9MzwK8kUeSBBuM2kOmXqB1pswC4TGB3TBP/Xp3GfYm8=" crossorigin="anonymous"></script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-o9N1j8m+M0E2vYQy0q6r9t2wq6fQm0zq1Y3MqtWm2+g=" crossorigin=""></script>

  <script src="app.js"></script>
</body>
</html>
